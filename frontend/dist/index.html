<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto API · Painel de Estoque</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="app-header">
        <div class="app-header__brand">
            <span class="app-header__mark">P</span>
            <div>
                <h1>Painel de Estoque</h1>
                <p>Cliente REST para <code>/produtos</code></p>
            </div>
        </div>
        <div class="app-header__status" id="conn-status">
            <span class="dot" id="conn-dot"></span>
            <span id="conn-text">verificando conexão…</span>
        </div>
    </header>

    <main class="layout">

        <!-- Coluna do formulário -->
        <section class="panel panel--form" aria-labelledby="form-title">
            <div class="panel__head">
                <h2 id="form-title">Cadastro</h2>
                <span class="eyebrow" id="form-mode">novo registro</span>
            </div>

            <form id="produto-form" novalidate>
                <div class="field">
                    <label for="id">ID <span class="field__hint">(consulta / atualização)</span></label>
                    <input type="text" id="id" inputmode="numeric" placeholder="ex: 12" autocomplete="off">
                </div>

                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Nome do produto" autocomplete="off">
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="preco">Preço</label>
                        <input type="text" id="preco" inputmode="decimal" placeholder="0,00" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="quantidade">Quantidade</label>
                        <input type="text" id="quantidade" inputmode="numeric" placeholder="0" autocomplete="off">
                    </div>
                </div>

                <div class="field">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="">Selecionar…</option>
                        <option value="DISPONIVEL">Disponivel</option>
                        <option value="ESGOTADO">Esgotado</option>
                    </select>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn--primary" data-action="salvar">Salvar</button>
                    <button type="button" class="btn btn--secondary" data-action="atualizar">Atualizar</button>
                    <button type="button" class="btn btn--ghost" data-action="consultar">Consultar</button>
                    <button type="button" class="btn btn--danger" data-action="deletar">Excluir</button>
                </div>
                <button type="button" class="btn btn--link" data-action="limpar">Limpar campos</button>
            </form>

            <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        </section>

        <!-- Coluna da listagem -->
        <section class="panel panel--list" aria-labelledby="list-title">
            <div class="panel__head">
                <h2 id="list-title">Produtos</h2>
                <span class="counter" id="total-produtos">0 itens</span>
            </div>

            <ul class="product-list" id="lista-produtos"></ul>

            <div class="empty-state" id="empty-state" hidden>
                <p>Nenhum produto cadastrado ainda.</p>
                <span>Use o formulário ao lado para adicionar o primeiro.</span>
            </div>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
